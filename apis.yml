description: 'Blind (teamblind.com) is an anonymous professional community platform where verified
  employees discuss compensation, interview experiences, layoffs, company culture, and career decisions
  while preserving their anonymity through work-email verification. The platform organizes conversation
  into company channels, industry topics, and location-based feeds, and runs on a freemium model with a
  For Business offering. It operates primarily as a consumer mobile and web app; no public developer API,
  developer portal, or well-known discovery surface was found during enrichment (all /.well-known/* probes
  returned 404). Sector: consumer / professional social network. Surfaced as a portfolio company of
  dcm-ventures.'
